name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Versione dal tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Le release richiedono la chiave di firma
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Manca il secret SIGNING_KEYSTORE_BASE64: senza una chiave fissa gli aggiornamenti non si installano"
            exit 1
          fi

      - name: Keystore di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test e lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease assembleDebug
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/myFifty-${VERSION_NAME:-dev}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk out/myFifty-debug.apk

      - uses: actions/upload-artifact@v5
        with:
          name: myFifty-apk
          path: out/*.apk

      - name: Note di rilascio dal CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          awk -v v="$VERSION_NAME" '$0 ~ "^## \\[?"v"\\]?( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Versione $VERSION_NAME" > notes.md; fi
          cat notes.md

      - name: Pubblica release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: myFifty ${{ env.VERSION_NAME }}
          body_path: notes.md
          files: out/myFifty-${{ env.VERSION_NAME }}.apk
